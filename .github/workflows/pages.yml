name: Publish to GitHub Pages

on:
  push:
    branches: [claude/kids-anatomy-prototype-30tbf5, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build every toy and prove its geometry
        run: |
          for toy in jack-in-the-box seesaw gears circuit pulley; do
            node "$toy/build.mjs" --audit
          done
          node build-site.mjs
      - name: Collect the site
        run: |
          mkdir -p _site
          cp index.html _site/
          for toy in jack-in-the-box seesaw gears circuit pulley; do
            mkdir -p "_site/$toy"
            cp "$toy/index.html" "_site/$toy/"
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
